<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Array</title>
        <script>
            let pilhaPessoas = Array();

            function mostrarLista(){
                const container = document.getElementById('minhaDiv');
                conatiner.innerHTML = '';


                for(var i = 0; i < pilhaPessoas.length; i++) {
                    var tag = '<h5>' + i + ' - ' + pilhaPessoas[i] + '</h5>';
                    container.innerHTML += tag;
                }
            }

    function adicionar(){
        var nome = prompt('Qual nome da pessoa?');
        pilhaPessoas.push(nome);
        mostrarLista();

    }
    
    function posição() {
        var indice = prompt('Qual posição da lista deseja consultar?');
        indice = Number(indice);
        if (indice < 0 || indice >= pilhaPessoas.length){
            alert('posição invalida');
            return;
        }
        alert('Na posição '+indice+' está: ' +pilhaPessoas[indice] );
    }

    function remover() {
        if (pilhaPessoas.length === 0){
            alert('A pilha esta vazia!');
        } else {
            let removido = pilhaPessoas.pop();
            alert('Removido:' + removido);
            mostrarLista()
        }
    }

    function limparLista() {
        pilhaPessoas = [];
        mostrarLista();
    }

    function inverterPilha(){
        pilhaPessoas.reverse();
        mostrarLista();
    }




            
        </script>


<body>

    <h1>Lista de Pessoas</h1>

    <button onclick="adicionar()">Adicionar Pessoas</button> <br><br>
    <button onclick="posição()">Posição</button>
    <button onclick="remover()">Remover</button>
    <button onclick="limparLista()">Limpar</button>
    <button onclick="inverterPilha()">Inverter Pilha</button>
    <div id="minhaDiv"></div>

    
</body>
    </head>
</html>
