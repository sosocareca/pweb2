<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Javascript</title>


    <script type="text/javascript">

    function escreveDiv(texto){
        document.getElementById("minhaDiv").innerHTML = texto;
    }

    function escreveDiv2(texto){
        texto = prompt('Digite um texto qualquer');
        document.getElementById("minhaDiv2").innerHTML = texto;
    }

    function escreverNumerosInput() {
        var input = document.getElementById("numeroInput");
        var n = parseInt(input.value);
        if (isNaN(n) || n <= 0) {
            alert("Por favor, insira um número válido maior que zero.");
            return;
        }
        var div = document.getElementById("numeroInput");
        div.innerHTML = "";
        for (var i = 1; i <= n; i++) {
            div.innerHTML += i + "<br>";
        }
    }

    </script>
</head>

<body>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Raiz Quadrada</title>
</head>
<body>

    <h2>Raiz Quadrada</h2>

    <!-- Botões para disparar a função com cada número -->
    <button onclick="calcularRaiz(25)">Raiz de 25</button><br><br>
    <button onclick="calcularRaiz(36)">Raiz de 36</button><br><br>
    <button onclick="calcularRaiz(49)">Raiz de 49</button>

    <script>
        // Função que recebe o número e calcula a raiz quadrada
        function calcularRaiz(numero) {
            var raiz = Math.sqrt(numero);
            alert("A raiz quadrada de " + numero + " é " + raiz);
        }
    </script>

</body>
</html>

    <h1>Escrevendo na Div</h1>
    <button onclick="escreveDiv('<h1> Programação Web</h1>')">Escrever</button> <br><br>
    
    <div id="minhaDiv"></div>

<hr>

    <h1>Escrevendo na Texto Dinâmico</h1>
    <button onclick="escreveDiv2()">Escrever</button> <br><br>
    <div id="minhaDiv2"></div>

    <hr>

    <h1> Desafio com input</h1>
    <label for="numeroInput">Digite o valor de N:</label>
    <input type="number" id="numeroInput" placeholder="Digite um numero" min="1">
    <button onclick="escreverNumerosInput()">Escrever Números</button>

    <br><br>

    <div id="numeroInput"></div>
  
</body>
</html>
